name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ashore
          POSTGRES_PASSWORD: ashore
          POSTGRES_DB: ashore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ashore" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://ashore:ashore@localhost:5432/ashore_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check app tests migrations
      - run: uv run ruff format --check app tests migrations
      - name: Migrations apply and match the models
        env:
          ENCRYPTION_KEYS: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
        run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
