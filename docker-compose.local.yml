# Personal stack for one computer: everything listens on 127.0.0.1 only, no domain, no HTTPS.
# Started by windows/start.ps1, which generates .env.local with random secrets on first run.
name: ashore

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ashore
      POSTGRES_USER: ashore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run windows/start.ps1 to create .env.local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashore -d ashore"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql+asyncpg://ashore:${POSTGRES_PASSWORD}@postgres:5432/ashore
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 30

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql+asyncpg://ashore:${POSTGRES_PASSWORD}@postgres:5432/ashore
      REDIS_URL: redis://redis:6379/0
    command: ["arq", "app.workers.main.WorkerSettings"]
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ASHORE_PORT:-8080}:80"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on: [frontend, backend]

volumes:
  pgdata:
  redisdata:
